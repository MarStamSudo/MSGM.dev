<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSGM BASE // login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg:      #0a0e0c;
        --panel:   #0f1512;
        --border:  #1e2b24;
        --border-hi: #2a3f34;
        --green:   #6fd9ac;
        --green-dim: #6fd9ac3a;
        --text:    #d3e8dc;
        --muted:   #62796f;
        --error:   #ff5c5c;
        --font:    'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    /* subtle scanline / grid texture */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(111,217,172,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(111,217,172,0.02) 1px, transparent 1px);
        background-size: 32px 32px;
        pointer-events: none;
        z-index: 0;
    }

    .scanline {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: linear-gradient(
            to bottom,
            transparent 0%,
            rgba(111,217,172,0.025) 50%,
            transparent 100%
        );
        height: 200%;
        animation: scan 10s linear infinite;
    }

    @keyframes scan {
        from { transform: translateY(-50%); }
        to   { transform: translateY(0%); }
    }

    .login-card {
        position: relative;
        z-index: 2;
        width: 340px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0;
        box-shadow: 0 0 40px rgba(57,255,136,0.06);
    }

    .card-header {
        border-bottom: 1px solid var(--border);
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 0.05em;
    }

    .dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
        animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .card-body {
        padding: 32px 28px 28px;
    }

    .brand {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        margin-bottom: 4px;
        color: var(--text);
    }

    .brand span { color: var(--green); }

    .subtitle {
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 28px;
        letter-spacing: 0.04em;
    }

    label {
        display: block;
        font-size: 0.68rem;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .field { margin-bottom: 18px; }

    input {
        width: 100%;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text);
        font-family: var(--font);
        font-size: 0.88rem;
        outline: none;
        transition: border-color 0.15s;
    }

    input::placeholder { color: #33453b; }

    input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 1px var(--green-dim);
    }

    button {
        width: 100%;
        padding: 11px;
        margin-top: 10px;
        background: transparent;
        color: var(--green);
        border: 1px solid var(--green);
        border-radius: 3px;
        font-family: var(--font);
        font-weight: 600;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.15s;
    }

    button:hover {
        background: var(--green);
        color: var(--bg);
        box-shadow: 0 0 20px var(--green-dim);
    }

    button:active { transform: scale(0.98); }

    .status-line {
        margin-top: 16px;
        font-size: 0.72rem;
        color: var(--muted);
        min-height: 16px;
    }

    .status-line.error { color: var(--error); }

    .footer-note {
        margin-top: 24px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 0.65rem;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        letter-spacing: 0.03em;
    }
</style>
</head>
<body>

<div class="scanline"></div>

<div class="login-card">
    <div class="card-header">
        <div class="dot"></div>
        SECURE SESSION // AWAITING AUTH
    </div>
    <div class="card-body">
        <div class="brand">MSGM<span>_</span>BASE</div>
        <div class="subtitle">restricted access terminal</div>

        <div class="field">
            <label for="user">username</label>
            <input type="text" id="user" placeholder="user_id" autocomplete="off">
        </div>
        <div class="field">
            <label for="pass">password</label>
            <input type="password" id="pass" placeholder="••••••••" autocomplete="off">
        </div>

        <button onclick="login()">ΣΥΝΔΕΣΗ →</button>

        <div class="status-line" id="statusLine">&gt; ready</div>

        <div class="footer-note">
            <span>v1.0</span>
            <span id="clock">--:--:--</span>
        </div>
    </div>
</div>

<script>
    function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const status = document.getElementById('statusLine');

        status.className = 'status-line';
        status.textContent = '> authenticating...';

        setTimeout(() => {
            if ((u === 'marinos' && p === 'marinos') || (u === 'giorgos' && p === 'giorgos')) {
                localStorage.setItem('isLoggedIn', 'true');
                status.textContent = '> access granted';
                setTimeout(() => window.location.href = 'workspace.html', 300);
            } else {
                status.className = 'status-line error';
                status.textContent = '> access denied: invalid credentials';
            }
        }, 400);
    }

    document.getElementById('pass').addEventListener('keypress', e => {
        if (e.key === 'Enter') login();
    });

    function tick() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('el-GR');
    }
    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
